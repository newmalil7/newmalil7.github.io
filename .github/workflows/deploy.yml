name: Deploy AI 瞭望台

# 触发：
#   1) 推送到 main 分支（首次部署 / 手动更新）
#   2) 定时：北京时间 09:00 = UTC 01:00 每日自动抓取刷新
#   3) 定时兜底：北京时间 12:00 = UTC 04:00 再刷一次
#      —— GitHub 的 schedule 在整点容易延迟甚至被跳过，只排一次的风险是
#         「当天没有新内容」。第三次补刷时抓取器会重新策展，跨天去重保证
#         结果稳定（内容没变就不会产生新提交）。
#   4) 手动：在 Actions 页面点 Run workflow
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:

# contents: write —— 用于把「每日归档 + 总结」提交回仓库，实现按日累积，
# 这样即使 iMac 关机，云端也会自己把每天的内容存下来。
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch & curate news
        env:
          # MyMemory 匿名额度约 5000 字符/天，带邮箱可提到约 50000 字符/天。
          # 想让每天全部要闻都配上中文，可在仓库 Settings → Secrets 里加
          # TRANSLATE_DE_EMAIL（填你自己的邮箱）。不配也能跑，只是当天翻得少，
          # 未翻的会在后续几天自动补上（译文有缓存，不会重复消耗额度）。
          TRANSLATE_DE_EMAIL: ${{ secrets.TRANSLATE_DE_EMAIL }}
          TRANSLATE_BUDGET: '45000'
        run: node scripts/fetch_news.mjs

      # 归档提交失败不应阻断部署：站点当天照常更新，只是少存一天归档
      - name: Persist daily archive & digest
        continue-on-error: true
        run: |
          set -e
          git config user.name "ai-horizon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add -f data/news-latest.json data/archive data/archive-index.json data/digest data/digests.json data/companies.json data/profiles.json data/i18n-cache.json
          if git diff --cached --quiet; then
            echo "本日数据无变化，跳过提交"
            exit 0
          fi
          DAY=$(TZ=Asia/Shanghai date +%F)
          git commit -m "chore(data): 每日归档与总结 ${DAY} [skip ci]"
          # 若远端在本任务运行期间又有前进，先 rebase 再推一次
          git push origin main || (git pull --rebase --autostash origin main && git push origin main)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
